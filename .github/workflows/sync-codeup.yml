name: Sync to Codeup

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_TOKEN: ${{ github.token }}
      CODEUP_SSH_URL: ${{ vars.CODEUP_SSH_URL }}
      CODEUP_SSH_KEY_B64: ${{ secrets.CODEUP_SSH_KEY_B64 }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Mirror branches and tags over SSH, then verify
        shell: bash
        run: |
          set -euo pipefail
          : "${CODEUP_SSH_URL:?Set the CODEUP_SSH_URL repository variable}"
          : "${CODEUP_SSH_KEY_B64:?Set the CODEUP_SSH_KEY_B64 Actions secret}"
          [[ "$CODEUP_SSH_URL" == git@codeup.aliyun.com:69aa892db28d0aba0f5ed47e/*.git ]]

          umask 077
          work_dir=$(mktemp -d)
          trap 'rm -rf -- "$work_dir"' EXIT
          printf '%s' "$CODEUP_SSH_KEY_B64" | base64 --decode > "$work_dir/codeup_ed25519"
          cat > "$work_dir/known_hosts" <<'HOSTS'
          codeup.aliyun.com ssh-rsa 
          HOSTS
          export GIT_SSH_COMMAND="ssh -i \"$work_dir/codeup_ed25519\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$work_dir/known_hosts\" -o BatchMode=yes"
          export GIT_ASKPASS="$work_dir/askpass.sh"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/usr/bin/env bash
          set -eu
          case "$1" in
            *Username*github.com*) printf '%s\n' 'x-access-token' ;;
            *Password*github.com*) printf '%s\n' "$SOURCE_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"

          # Read the current GitHub state so queued runs cannot restore old refs.
          git -c credential.helper= clone --bare \
            "https://github.com/$SOURCE_REPOSITORY.git" "$work_dir/source.git"
          cd "$work_dir/source.git"

          # Codeup is a mirror: branch/tag updates and deletions follow GitHub.
          git push --atomic --prune "$CODEUP_SSH_URL" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

          git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags \
            | LC_ALL=C sort > "$work_dir/expected-refs"
          git ls-remote --refs "$CODEUP_SSH_URL" 'refs/heads/*' 'refs/tags/*' \
            | awk '{print $1 " " $2}' | LC_ALL=C sort > "$work_dir/actual-refs"
          diff -u "$work_dir/expected-refs" "$work_dir/actual-refs"

          {
            printf '### Codeup SSH synchronization verified\n\n'
            printf 'Source: `%s`\n\n' "$SOURCE_REPOSITORY"
            printf 'Target: `%s`\n\n' "$CODEUP_SSH_URL"
            printf 'All branches and tags match the GitHub snapshot.\n'
          } >> "$GITHUB_STEP_SUMMARY"
