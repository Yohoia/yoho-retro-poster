<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="title desc">
  <title id="title">yoho-retro-poster — 给一个主色，让它变成风景</title>
  <desc id="desc">以暖纸色、珊瑚粉和层叠色面呈现项目标题。一个主色，可选两个指定色，生成一张方形无字风景插画。右侧为色票到地貌的几何示意，真实成品见下方展示。</desc>
  <defs>
    <clipPath id="swatch-clip"><rect x="922" y="56" width="222" height="222" rx="4"/></clipPath>
  </defs>
  <rect width="1200" height="336" rx="8" fill="#F7F1E8"/>
  <g id="title-block" fill="#65221B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="70" font-size="27" font-weight="650" letter-spacing="-0.8">yoho</text>
    <text x="155" y="69" font-size="18" letter-spacing="2.3" fill="#795F52">A COLOR-DRIVEN LANDSCAPE SKILL</text>
    <text x="50" y="184" font-size="112" font-weight="700" letter-spacing="-6">retro poster</text>
    <text x="56" y="244" font-size="34" font-weight="500" letter-spacing="1">给一个主色，让它变成风景。</text>
  </g>
  <g id="palette-key" transform="translate(56 283)">
    <rect width="52" height="12" fill="#D98278"/>
    <rect x="56" width="52" height="12" fill="#DDA49E"/>
    <rect x="112" width="52" height="12" fill="#E8D6D4"/>
    <text x="183" y="14" fill="#795F52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">#D98278 → 2048 × 2048</text>
  </g>
  <g id="color-to-landscape" clip-path="url(#swatch-clip)">
    <rect x="922" y="56" width="222" height="222" fill="#E8D6D4"/>
    <path d="M922 171 L1144 108 V278 H922Z" fill="#DDA49E"/>
    <path d="M922 196 Q1019 185 1144 252 V278 H922Z" fill="#D98278"/>
    <path d="M922 244 Q989 237 1041 278 H922Z" fill="#65221B"/>
  </g>
</svg>
